services:
  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["${REDIS_PORT:-6379}:6379"]

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: scraper
      POSTGRES_PASSWORD: scraper
      POSTGRES_DB: scraper
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - /var/lib/postgresql/data